<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Révision</title>
<meta name="description" content="Appli de révision : fiches, cartes en répétition espacée, QCM, exercices, cartes mentales et méthode du perroquet en anglais et en espagnol.">
<meta name="theme-color" content="#D4A12A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Révision">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..800,0..100,0..1&family=Jost:wght@400;500;600&display=swap">
<style>
/* Révision : deux univers.
   Accueil « Pastel pêche » (palettes 91-100), documents « Rétro 70 » (palettes 1-90).
   Les 8 tokens de palette (--bg --header --card --accent --text --text2 --pill --on) sont posés
   par le script sur chaque zone, avec les valeurs exactes du mode actif. Ici : valeurs de premier rendu. */
[hidden]{display:none!important}
:root{
  --bg:#FBF5E6; --header:#D4A12A; --card:#FDFBF5; --accent:#2E7F7A; --text:#102C2B; --text2:#618583; --pill:#F1E0B7; --on:#FFF4E6; --lbl:#FFF4E6; --sqfg:#2E7F7A;
  --scrim:rgb(40 22 10 / .26);
  --ico-disc:rgb(0 0 0 / .14);
  --heart-bg:#FFFFFF;
  --search-bg:rgb(255 255 255 / .88);
  --sq-bg:rgb(255 255 255 / .9);
  --glass:rgb(255 255 255 / .58);
  --hair:rgb(60 30 10 / .09);
  --shadow:0 10px 30px rgb(70 35 10 / .07), 0 2px 6px rgb(70 35 10 / .05);
  --shadow-lg:0 24px 60px rgb(70 35 10 / .16), 0 6px 16px rgb(70 35 10 / .08);
  --f-ui:"Jost","Outfit",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --f-retro:"Fraunces","Recoleta","Cooper Std","Young Serif",Georgia,serif;
  --ease:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017 20%,1.042 23.4%,1.035 27.4%,1.007 35.6%,.998 43.3%,1);
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#27200F; --header:#755917; --card:#3B3119; --accent:#6DA5A2; --text:#FCF8EE; --text2:#C0BCB4; --pill:#5F4B1B; --on:#27200F; --lbl:#FCF8EE; --sqfg:#FCF8EE;
    --scrim:rgb(0 0 0 / .5); --ico-disc:rgb(255 255 255 / .3); --heart-bg:rgb(255 255 255 / .13);
    --search-bg:rgb(255 255 255 / .14); --sq-bg:rgb(255 255 255 / .16); --glass:rgb(0 0 0 / .34); --hair:rgb(255 255 255 / .1);
    --shadow:0 10px 30px rgb(0 0 0 / .26), 0 2px 6px rgb(0 0 0 / .2); --shadow-lg:0 24px 60px rgb(0 0 0 / .5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#27200F; --header:#755917; --card:#3B3119; --accent:#6DA5A2; --text:#FCF8EE; --text2:#C0BCB4; --pill:#5F4B1B; --on:#27200F; --lbl:#FCF8EE; --sqfg:#FCF8EE;
  --scrim:rgb(0 0 0 / .5); --ico-disc:rgb(255 255 255 / .3); --heart-bg:rgb(255 255 255 / .13);
  --search-bg:rgb(255 255 255 / .14); --sq-bg:rgb(255 255 255 / .16); --glass:rgb(0 0 0 / .34); --hair:rgb(255 255 255 / .1);
  --shadow:0 10px 30px rgb(0 0 0 / .26), 0 2px 6px rgb(0 0 0 / .2); --shadow-lg:0 24px 60px rgb(0 0 0 / .5);
  color-scheme:dark;
}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode-fade, .mode-fade *{transition:background-color .5s ease,color .5s ease,border-color .5s ease,fill .5s ease !important}
.ic{display:inline-grid;place-items:center;width:22px;height:22px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.retro{font-family:var(--f-retro);font-variation-settings:"SOFT" 100,"WONK" 0}

#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}

/* ---------- Accueil : Pastel pêche ---------- */
.home{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);transform-origin:50% 40%}
.h-head{position:relative;z-index:3;background:var(--header);border-radius:0 0 28px 28px;padding-top:calc(var(--safe-t) + 12px);padding-bottom:14px;box-shadow:0 8px 26px rgb(0 0 0 / .06)}
.wrap{padding-left:var(--gut-l);padding-right:var(--gut-r);max-width:1180px;margin:0 auto;box-sizing:border-box;width:100%}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--lbl);margin-bottom:12px}
.brand-name{display:flex;align-items:center;gap:9px;font:600 21px/1 var(--f-retro);font-variation-settings:"SOFT" 100,"WONK" 1;letter-spacing:.005em}
.brand-disc{width:22px;height:22px;border-radius:50%;background:repeating-radial-gradient(circle,var(--lbl) 0 1px,transparent 1px 3px);position:relative;opacity:.95}
.brand-disc::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--lbl)}
.brand-day{font:500 12.5px var(--f-ui);opacity:.92;text-align:right}
.h-top{display:flex;gap:10px;align-items:center}
.search-field{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;border-radius:12px;background:var(--search-bg);color:var(--text2);border:0;padding:0 14px;font-size:15px;text-align:left;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.search-field kbd{margin-left:auto;font:500 11px var(--f-ui);border-radius:6px;padding:2px 6px;background:var(--hair);color:var(--text2)}
.sq-btn{width:46px;height:46px;border-radius:14px;background:var(--search-bg);border:0;display:grid;place-items:center;color:var(--text);flex:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pills{display:flex;gap:12px;overflow-x:auto;padding:14px 2px 2px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity}
.pills::-webkit-scrollbar{display:none}
.pill-item{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--lbl);font:500 11.5px/1.15 var(--f-ui);width:62px;flex:none;scroll-snap-align:start;text-shadow:0 1px 2px rgb(0 0 0 / .12)}
.pill-sq{width:44px;height:44px;border-radius:12px;background:var(--sq-bg);display:grid;place-items:center;color:var(--sqfg);transition:transform .4s var(--ease),background-color .25s,color .25s;text-shadow:none}
.pill-sq .tx{font:700 14px var(--f-retro);font-variation-settings:"SOFT" 100;letter-spacing:.02em}
.pill-item[aria-current="true"] .pill-sq{background:var(--accent);color:var(--on);transform:scale(1.08)}
.pill-lbl{max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-item.add .pill-sq{background:transparent;border:2px dashed var(--lbl);color:var(--lbl);opacity:.85}

.pager{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:pan-y}
.track{display:flex;height:100%;will-change:transform}
.page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.page-inner{padding-top:4px;padding-bottom:calc(var(--safe-b) + 150px)}
.page-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 2px 12px}
.page-title h2{font:600 27px/1.1 var(--f-ui);margin:0;letter-spacing:-.012em;text-wrap:balance}
.page-title .count{color:var(--text2);font-size:13px;white-space:nowrap}
.page-sub{color:var(--text2);margin:-6px 2px 14px;font-size:14px}

.doc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.dcard{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--card);border-radius:20px;padding:16px 16px 16px 18px;box-shadow:var(--shadow);color:var(--text);text-align:left;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .35s var(--ease),box-shadow .3s;outline-offset:3px}
.dcard:active{transform:scale(.975)}
.dcard h3{font:600 17px/1.25 var(--f-ui);margin:0 0 4px;text-wrap:balance;overflow-wrap:anywhere}
.dcard .desc{color:var(--text2);font-size:13.5px;line-height:1.42;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px 12px;margin-top:10px;font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums}
.meta .m{display:inline-flex;align-items:center;gap:5px}
.meta .ic{width:14px;height:14px}
.bar{width:54px;height:5px;border-radius:9px;background:var(--pill);overflow:hidden;display:inline-block}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.gen{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:500}
.gen::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.thumb-wrap{position:relative;flex:none}
.thumb{position:relative;width:80px;height:98px;border-radius:16px;background:var(--header);color:var(--on);overflow:hidden;display:grid;place-items:center}
.thumb .rings{position:absolute;left:50%;top:50%;width:170%;height:170%;transform:translate(-50%,-50%);opacity:.18;color:var(--on)}
.thumb .sleeve{position:relative;width:46px;height:46px;border-radius:12px;background:var(--accent);border:2px solid color-mix(in srgb,var(--on) 60%,transparent);display:grid;place-items:center}
.thumb .ini{font:700 23px/1 var(--f-retro);font-variation-settings:"SOFT" 100,"WONK" 1;color:var(--on)}
.thumb.sm{width:44px;height:54px;border-radius:12px}
.thumb.sm .sleeve{width:26px;height:26px;border-radius:8px;border-width:1.5px}
.thumb.sm .ini{font-size:13px}
.thumb.dock{width:54px;height:54px;border-radius:15px}
.thumb.dock .sleeve{width:30px;height:30px;border-radius:9px}
.thumb.dock .ini{font-size:15px}
.heart{position:absolute;left:-13px;bottom:-9px;width:34px;height:34px;border-radius:11px;background:var(--heart-bg);border:0;box-shadow:0 4px 12px rgb(0 0 0 / .1);display:grid;place-items:center;color:var(--accent);transition:transform .35s var(--ease)}
.heart .ic{width:18px;height:18px}
.heart:active{transform:scale(.86)}
.heart.on{color:var(--accent)}

.due{display:flex;align-items:center;gap:14px;background:var(--pill);border-radius:20px;padding:12px 12px 12px 18px;margin-bottom:14px}
.due b{font:600 24px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.due .txt{flex:1;min-width:0;font-size:13.5px;color:var(--text)}
.due .txt small{display:block;color:var(--text2);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:14px;border:0;background:var(--accent);color:var(--on);font:500 15px var(--f-ui);white-space:nowrap;transition:transform .3s var(--ease),opacity .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:default}
.btn.soft{background:var(--pill);color:var(--text)}
.btn.ghost{background:transparent;color:var(--accent);padding:0 10px}
.btn.sm{height:36px;padding:0 13px;font-size:14px;border-radius:12px}
.btn.danger{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--hair)}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:999px;border:0;background:var(--accent);color:var(--on);font:600 16px var(--f-ui);margin-top:18px;transition:transform .35s var(--ease)}
.btn-primary:active{transform:scale(.97)}
.empty{background:var(--card);border-radius:20px;padding:26px 22px;text-align:center;box-shadow:var(--shadow)}
.empty h3{font:600 18px var(--f-ui);margin:0 0 6px}
.empty p{color:var(--text2);margin:0 auto;max-width:42ch}
.example-tag{display:inline-block;font:600 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;background:var(--pill);color:var(--text);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}

.folder{cursor:pointer}
.folder-grid{display:grid;grid-template-columns:repeat(2,36px);grid-template-rows:repeat(2,44px);gap:5px;padding:6px;border-radius:18px;background:var(--pill)}
.folder-grid .thumb{width:36px;height:44px;border-radius:9px}
.folder-grid .thumb .sleeve{width:20px;height:20px;border-radius:6px;border-width:1px}
.folder-grid .thumb .ini{font-size:10px}

.dots{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 94px);display:flex;justify-content:center;gap:8px;z-index:4;pointer-events:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text);opacity:.2;transition:opacity .25s,transform .3s var(--ease)}
.dot.on{opacity:.72;transform:scale(1.15)}
.dock{position:absolute;left:50%;bottom:calc(var(--safe-b) + 12px);transform:translateX(-50%);display:flex;gap:12px;padding:10px 12px;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:var(--shadow-lg);z-index:4;max-width:calc(100% - 32px);box-sizing:border-box}
.dock-item{width:56px;height:56px;border-radius:16px;border:0;padding:0;background:var(--accent);color:var(--on);display:grid;place-items:center;flex:none;transition:transform .35s var(--ease)}
.dock-item:active{transform:scale(.9)}
.dock-item .tx{font:700 17px var(--f-retro);font-variation-settings:"SOFT" 100}
.dock-item.doc{background:transparent}
.dock-item .ic{width:26px;height:26px}

/* Mode édition (appui long prolongé) */
@keyframes jiggle{0%{rotate:-.7deg}50%{rotate:.7deg}100%{rotate:-.7deg}}
.editing .dcard{animation:jiggle .3s ease-in-out infinite;touch-action:none}
.editing .dcard:nth-child(2n){animation-delay:-.15s;animation-duration:.34s}
.editing .dcard.dragging{animation:none;z-index:9;box-shadow:var(--shadow-lg);transition:none}
@media (hover:none){.search-field kbd{display:none}}
.del-badge{position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--text);color:var(--bg);display:none;place-items:center;box-shadow:var(--shadow);z-index:2}
.del-badge .ic{width:16px;height:16px}
.editing .del-badge{display:grid}
.done-edit{position:absolute;top:calc(var(--safe-t) + 14px);right:var(--gut-r);z-index:6;display:none}
.editing .done-edit{display:inline-flex}

/* ---------- Vue document : Rétro 70 ---------- */
.dv{position:absolute;inset:0;z-index:20;background:var(--bg);color:var(--text);overflow:hidden;transform-origin:0 0;will-change:transform}
.dv-scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.dv-head{position:relative;height:clamp(280px,42vh,440px);background:var(--header);border-radius:0 0 40px 40px;overflow:hidden;display:grid;place-items:center;padding-top:var(--safe-t);box-sizing:border-box}
.rings-big{position:absolute;left:50%;top:calc(50% + var(--safe-t) / 2);width:min(150vw,820px);aspect-ratio:1;transform:translate(-50%,-50%);color:var(--on);opacity:.18;pointer-events:none}
.cover{position:relative;width:clamp(132px,34vw,176px);aspect-ratio:1;border-radius:30px;background:var(--accent);border:3px solid color-mix(in srgb,var(--on) 60%,transparent);color:var(--on);display:grid;place-items:center;box-shadow:0 22px 50px rgb(0 0 0 / .2);will-change:transform}
.cover .ini{font:700 clamp(58px,15vw,78px)/1 var(--f-retro);font-variation-settings:"SOFT" 100,"WONK" 1}
.cover .kind{position:absolute;bottom:15px;left:0;right:0;text-align:center;font:600 10px var(--f-ui);letter-spacing:.18em;text-transform:uppercase;opacity:.9}
.cover-wrap{position:relative;display:grid;place-items:center;will-change:transform}
.cover-wrap .disc{position:absolute;left:38%;top:8%;width:84%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,color-mix(in srgb,var(--on) 20%,transparent) 0 1px,transparent 1px 4px),var(--text);box-shadow:0 10px 30px rgb(0 0 0 / .2)}
.cover-wrap .disc::after{content:"";position:absolute;inset:35%;border-radius:50%;background:var(--pill);box-shadow:0 0 0 4px var(--accent)}
.dv-btn{position:absolute;top:calc(var(--safe-t) + 12px);z-index:7;width:42px;height:42px;border-radius:50%;border:0;background:var(--ico-disc);color:var(--on);display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .3s var(--ease)}
.dv-btn:active{transform:scale(.88)}
.dv-btn.back{left:var(--gut-l)}
.dv-btn.fav{right:var(--gut-r)}
.dv-bar{position:absolute;top:0;left:0;right:0;z-index:6;height:calc(var(--safe-t) + 66px);padding-top:var(--safe-t);box-sizing:border-box;background:var(--header);border-radius:0 0 24px 24px;display:flex;align-items:center;justify-content:center;padding-left:76px;padding-right:76px;transform:translateY(-105%);transition:transform .45s var(--ease);box-shadow:0 10px 30px rgb(0 0 0 / .1)}
.dv-bar.show{transform:none}
.dv-bar .t{font:600 17px var(--f-retro);font-variation-settings:"SOFT" 100;color:var(--lbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-body{max-width:760px;margin:0 auto;padding:26px var(--gut-r) calc(var(--safe-b) + 130px) var(--gut-l);box-sizing:border-box}
.dv-title{font:650 clamp(29px,6.4vw,42px)/1.06 var(--f-retro);font-variation-settings:"SOFT" 100,"WONK" 1;margin:0;letter-spacing:-.012em;text-wrap:balance;overflow-wrap:anywhere}
.dv-sub{color:var(--text2);margin-top:8px;font-size:15px}
.dv-info{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-top:18px}
.prog{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.prog svg{width:30px;height:30px;transform:rotate(-90deg)}
.pill-sel{display:inline-flex;align-items:center;background:var(--pill);border-radius:999px;height:40px;padding:0 4px;gap:2px;max-width:100%}
.pill-sel button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--text);display:grid;place-items:center;flex:none}
.pill-sel button:disabled{opacity:.3}
.pill-sel span{padding:0 6px;font:500 14px var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pill-btn{height:40px;padding:0 15px;border-radius:999px;border:0;background:var(--pill);color:var(--text);display:inline-flex;align-items:center;gap:6px;font:500 14px var(--f-ui)}
.sec-h{font:600 21px/1.2 var(--f-retro);font-variation-settings:"SOFT" 100;margin:30px 0 10px}
.about{font-size:16px;line-height:1.62;margin:0;max-width:62ch}
.guide-box{background:var(--card);border-radius:20px;padding:14px 16px;margin:16px 0 0;max-width:62ch}
.guide-h{display:flex;align-items:center;gap:8px;font-size:14.5px;min-height:34px}
.guide-h b{font-weight:600}
.guide-box p{margin:6px 0 2px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.guide-chips{margin-top:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:26px -4px 18px;padding:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;padding:0 16px;border-radius:999px;border:0;background:var(--pill);color:var(--text);font:500 14.5px var(--f-ui);display:inline-flex;align-items:center;gap:7px;transition:background-color .25s,color .25s}
.tab .ic{width:17px;height:17px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on)}
.blk{background:var(--card);border-radius:28px;padding:22px 22px;margin-bottom:14px}
.blk h3{font:600 21px/1.22 var(--f-retro);font-variation-settings:"SOFT" 100;margin:0 0 12px;text-wrap:balance}
.blk h4{font:600 16px var(--f-ui);margin:16px 0 6px}
.md p{margin:0 0 .8em;line-height:1.62;max-width:65ch}
.md ul,.md ol{margin:0 0 .8em;padding-left:1.25em;line-height:1.6}
.md li{margin:.15em 0}
.md li::marker{color:var(--accent)}
.md strong{font-weight:600}
.md mark{background:var(--pill);color:inherit;border-radius:6px;padding:.05em .25em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:var(--pill);border-radius:6px;padding:.05em .3em}
.md > :last-child{margin-bottom:0}
.callout{background:var(--pill);border-radius:22px;padding:14px 18px;margin:0 0 .9em}
.callout p:last-child{margin:0}
.keypts{background:var(--pill);border-radius:22px;padding:14px 18px;margin-top:14px}
.keypts .lab{font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.keypts ul{margin:0;padding-left:1.1em}
.cta-bar{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:26px var(--gut-r) calc(var(--safe-b) + 14px) var(--gut-l);background:linear-gradient(to top,var(--bg) 62%,color-mix(in srgb,var(--bg) 0%,transparent));pointer-events:none}
.btn-retro{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:760px;margin:0 auto;height:58px;border-radius:999px;border:0;background:var(--accent);color:var(--on);font:650 18px var(--f-retro);font-variation-settings:"SOFT" 100;transition:transform .35s var(--ease);box-shadow:0 12px 30px rgb(0 0 0 / .14)}
.btn-retro:active{transform:scale(.97)}
.btn-retro small{font:500 13px var(--f-ui);opacity:.85}
.skel{border-radius:14px;background:linear-gradient(90deg,var(--pill),color-mix(in srgb,var(--pill) 45%,var(--card)),var(--pill));background-size:300% 100%;animation:shimmer 1.6s linear infinite;height:14px;margin:10px 0}
@keyframes shimmer{to{background-position:-300% 0}}
.status{display:flex;align-items:center;gap:12px;color:var(--text2);font-size:14px}
.status .spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--pill);border-top-color:var(--accent);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:var(--pill);border-radius:20px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.muted{color:var(--text2)}
.small{font-size:13px}

/* Cartes (onglet) */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:22px;padding:14px 16px}
.stat b{display:block;font:600 26px/1.1 var(--f-retro);font-variation-settings:"SOFT" 100;font-variant-numeric:tabular-nums}
.stat span{color:var(--text2);font-size:12.5px}
.fc{background:var(--card);border-radius:24px;padding:16px 18px;margin-bottom:10px}
.fc .q{font-weight:500;line-height:1.45}
.fc .a{margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--pill);color:var(--text)}
.fc .a.hide{display:none}
.fc .tools{display:flex;gap:4px;margin-top:8px;justify-content:flex-end;align-items:center}
.fc .tools .st{margin-right:auto;font-size:12px;color:var(--text2)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;background:transparent;color:var(--text);display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--pill)}
.icon-btn .ic{width:19px;height:19px}

/* QCM */
.quiz-q{font:600 clamp(20px,4.6vw,25px)/1.3 var(--f-retro);font-variation-settings:"SOFT" 100;margin:6px 0 16px;text-wrap:pretty}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;border-radius:20px;padding:14px 16px;background:var(--pill);color:var(--text);font-size:15.5px;line-height:1.4;transition:transform .3s var(--ease),background-color .2s,color .2s}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--card);font:600 13px var(--f-ui)}
.choice:not(:disabled):active{transform:scale(.98)}
.choice.ok{background:var(--accent);color:var(--on)}
.choice.ok .k{background:var(--on);color:var(--accent)}
.choice.bad{background:var(--header);color:var(--on)}
.choice.bad .k{background:var(--on);color:var(--header)}
.choice:disabled{cursor:default}
.choice.dim{opacity:.55}
.qprog{display:flex;align-items:center;gap:10px;color:var(--text2);font-size:13px;font-variant-numeric:tabular-nums}
.qprog .bar{flex:1;width:auto;height:6px}

/* Exercices */
.lvl{display:inline-flex;gap:4px;vertical-align:middle;margin-right:8px}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--pill)}
.lvl i.on{background:var(--accent)}
.reveal{margin-top:12px;border-radius:22px;background:var(--pill);padding:14px 18px}
.reveal .lab{font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
textarea.inp,input.inp{width:100%;box-sizing:border-box;border:0;border-radius:16px;background:var(--pill);color:var(--text);padding:12px 14px;font-size:15px;line-height:1.45;resize:vertical}
textarea.inp::placeholder,input.inp::placeholder{color:var(--text2)}
input.inp{height:46px}
select.inp{height:46px;border:0;border-radius:14px;background:var(--pill);padding:0 12px;width:100%}

/* Carte mentale */
.mm-wrap{background:var(--card);border-radius:28px;overflow:auto;padding:10px;max-height:72vh;touch-action:pan-x pan-y}
.mm-wrap svg{display:block}
.mm-wrap text{font-family:var(--f-ui);fill:var(--text)}

/* ---------- Révision (répétition espacée) ---------- */
.study,.parrot{position:absolute;inset:0;z-index:40;background:var(--bg);color:var(--text);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .5s var(--ease),background-color .4s}
.study.open,.parrot.open{transform:none}
.st-top{display:flex;align-items:center;gap:12px;padding:calc(var(--safe-t) + 12px) var(--gut-r) 10px var(--gut-l)}
.st-top .ttl{flex:1;min-width:0}
.st-top .ttl b{display:block;font:600 15px var(--f-retro);font-variation-settings:"SOFT" 100;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-top .ttl span{font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums}
.round-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--pill);color:var(--text);display:grid;place-items:center;flex:none}
.st-prog{height:6px;border-radius:9px;background:var(--pill);overflow:hidden;margin:0 var(--gut-r) 0 var(--gut-l)}
.st-prog i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .5s var(--ease)}
.st-stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:18px var(--gut-r) 16px var(--gut-l)}
.st-card{width:100%;max-width:640px;background:var(--card);border-radius:30px;padding:26px 24px 24px;position:relative;overflow:hidden;margin:auto 0;box-sizing:border-box;transition:background-color .4s}
.st-card .corner{position:absolute;right:-70px;top:-70px;width:200px;height:200px;color:var(--header);opacity:.5;pointer-events:none}
.st-card .src{font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin-bottom:14px;position:relative}
.st-q{font:600 clamp(21px,5vw,29px)/1.28 var(--f-retro);font-variation-settings:"SOFT" 100;position:relative;text-wrap:pretty;overflow-wrap:anywhere}
.st-a{margin-top:18px;padding-top:18px;border-top:2px dashed var(--pill);font-size:17px;line-height:1.55;position:relative}
.st-mine{margin-top:14px}
.st-mine .lab{font-size:12.5px;color:var(--text2);margin-bottom:6px}
.st-foot{padding:10px var(--gut-r) calc(var(--safe-b) + 14px) var(--gut-l);display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:680px;width:100%;margin:0 auto;box-sizing:border-box}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{border:0;border-radius:18px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 14.5px var(--f-ui);transition:transform .3s var(--ease)}
.grade:active{transform:scale(.94)}
.grade small{font:500 11.5px var(--f-ui);opacity:.8;font-variant-numeric:tabular-nums}
.grade.g1{background:var(--header);color:var(--on)}
.grade.g2{background:var(--pill);color:var(--text)}
.grade.g3{background:var(--accent);color:var(--on)}
.grade.g4{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 2px var(--accent)}
.kbd-hint{text-align:center;font-size:12px;color:var(--text2)}
.done-card{text-align:center}
.done-card .big{font:650 54px/1 var(--f-retro);font-variation-settings:"SOFT" 100,"WONK" 1;margin:8px 0}

/* ---------- Mode perroquet ---------- */
.pr-head{position:relative;flex:none;background:var(--header);border-radius:0 0 40px 40px;overflow:hidden;padding:calc(var(--safe-t) + 64px) var(--gut-r) 22px var(--gut-l);display:flex;flex-direction:column;align-items:center;gap:14px;transition:background-color .4s}
.pr-head .rings-big{top:58%;width:min(120vw,680px)}
.pr-top{position:absolute;top:calc(var(--safe-t) + 12px);left:var(--gut-l);right:var(--gut-r);display:flex;align-items:center;gap:10px;z-index:2}
.pr-top .ttl{flex:1;text-align:center;color:var(--lbl);font:600 14px var(--f-ui);font-variant-numeric:tabular-nums}
.pr-top .dv-btn{position:static}
.disc-btn{position:relative;width:clamp(112px,30vw,148px);aspect-ratio:1;border-radius:50%;border:0;padding:0;background:repeating-radial-gradient(circle,color-mix(in srgb,var(--on) 16%,transparent) 0 1px,transparent 1px 4px),var(--accent);box-shadow:0 18px 40px rgb(0 0 0 / .22);display:grid;place-items:center;color:var(--accent)}
.disc-btn::before{content:"";position:absolute;inset:31%;border-radius:50%;background:var(--on)}
.disc-btn .ic{position:relative;width:30px;height:30px}
.disc-btn.spin{animation:spin 2.2s linear infinite}
.disc-btn.spin .ic{animation:spin 2.2s linear infinite reverse}
.pr-tools{display:flex;gap:10px;position:relative;z-index:1;flex-wrap:wrap;justify-content:center}
.pr-tool{height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--ico-disc);color:var(--on);display:inline-flex;align-items:center;gap:7px;font:500 14px var(--f-ui);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pr-tool[aria-pressed="true"]{background:var(--on);color:var(--header)}
.pr-tool .ic{width:18px;height:18px}
.pr-body{flex:1;min-height:0;overflow-y:auto;padding:22px var(--gut-r) 12px var(--gut-l)}
.pr-inner{max-width:680px;margin:0 auto}
.pr-kind{font:600 11px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--text2);margin-bottom:10px}
.pr-phrase{font:600 clamp(25px,6vw,36px)/1.32 var(--f-retro);font-variation-settings:"SOFT" 100;margin:0;overflow-wrap:anywhere}
.pr-phrase.long{font-size:clamp(20px,4.4vw,26px);line-height:1.45}
.w{cursor:pointer;border-radius:8px;transition:background-color .15s,box-shadow .15s}
.w:hover{background:color-mix(in srgb,var(--pill) 60%,transparent)}
.w.sel{background:var(--pill);box-shadow:0 0 0 3px var(--pill)}
.pr-fr{margin-top:14px;color:var(--text2);font-size:17px;line-height:1.5;filter:blur(7px);transition:filter .35s;cursor:pointer;user-select:none}
.pr-fr.show{filter:none;user-select:text}
.pr-note{margin-top:12px;font-size:14px;color:var(--text);background:var(--pill);border-radius:16px;padding:10px 14px;display:inline-block}
.reps{display:flex;gap:8px;align-items:center;margin-top:20px;flex-wrap:wrap;color:var(--text2);font-size:13.5px}
.rep{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--accent);transition:background-color .25s,transform .35s var(--ease)}
.rep.done{background:var(--accent);transform:scale(1.1)}
.tr-pop{margin-top:16px;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow)}
.tr-pop .src{font:600 15px var(--f-retro);font-variation-settings:"SOFT" 100}
.tr-pop .res{font-size:16px;margin-top:4px}
.tr-pop .det{font-size:13px;color:var(--text2);margin-top:6px}
.check-res{margin-top:14px;font-size:15px;line-height:1.6}
.check-res .ok{color:var(--accent);font-weight:600}
.check-res .miss{text-decoration:underline wavy;text-decoration-color:var(--header);text-underline-offset:4px}
.pr-foot{flex:none;padding:10px var(--gut-r) calc(var(--safe-b) + 14px) var(--gut-l);display:flex;gap:10px;max-width:712px;width:100%;margin:0 auto;box-sizing:border-box}
.pr-foot .btn-retro{flex:1;height:54px;font-size:17px}
.pr-foot .round-btn{width:54px;height:54px}
.pr-foot .round-btn[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.flip{perspective:1400px;margin:4px 0 0}
.flip-in{position:relative;min-height:220px;transition:transform .7s var(--ease);transform-style:preserve-3d;cursor:pointer}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;padding:26px 22px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:12px}
.face.front{background:var(--card)}
.face.back{background:var(--accent);color:var(--on);transform:rotateY(180deg)}
.face .lab{font:600 11px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.face .txt{font:600 clamp(21px,5vw,28px)/1.3 var(--f-retro);font-variation-settings:"SOFT" 100;overflow-wrap:anywhere}
.lang-hero{position:relative;overflow:hidden;background:var(--card);border-radius:20px;padding:20px 18px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.lang-hero .hrings{position:absolute;right:-60px;top:-60px;width:210px;height:210px;color:var(--pill);pointer-events:none}
.lang-hero h3{position:relative;font:600 21px var(--f-ui);margin:0 0 4px}
.lang-hero p{position:relative;color:var(--text2);margin:0 0 14px;max-width:46ch;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.chip{height:34px;padding:0 13px;border-radius:12px;border:0;background:var(--pill);color:var(--text);font:500 13.5px var(--f-ui);display:inline-flex;align-items:center;gap:6px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.chip .ic{width:15px;height:15px}
.tr-box{display:flex;gap:8px;background:var(--card);border-radius:20px;padding:8px;box-shadow:var(--shadow);margin-bottom:14px}
.tr-box input{flex:1;min-width:0;border:0;background:transparent;padding:0 10px;font-size:15px;color:var(--text);height:42px}
.tr-box input::placeholder{color:var(--text2)}
.tr-out{background:var(--card);border-radius:20px;padding:14px 18px;margin:-6px 0 14px;box-shadow:var(--shadow)}

/* ---------- Feuilles, menus, recherche ---------- */
.scrim{position:absolute;inset:0;z-index:60;background:var(--scrim);opacity:0;transition:opacity .3s;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.scrim.open{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:min(92%,880px);background:var(--card);color:var(--text);border-radius:28px 28px 0 0;display:flex;flex-direction:column;transform:translateY(104%);transition:transform .5s var(--ease);box-shadow:var(--shadow-lg)}
.sheet.open{transform:none}
.sh-head{position:relative;flex:none;display:flex;align-items:center;gap:10px;padding:18px var(--gut-r) 10px var(--gut-l);touch-action:none}
.grab{position:absolute;top:7px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:9px;background:var(--hair)}
.sh-title{flex:1;margin:0;font:600 19px var(--f-ui)}
.sh-body{overflow-y:auto;padding:4px var(--gut-r) calc(var(--safe-b) + 22px) var(--gut-l);overscroll-behavior:contain}
.fld{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.fld > label,.fld > .lab{font:500 13.5px var(--f-ui);color:var(--text2)}
.seg{display:flex;background:var(--pill);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border:0;border-radius:11px;background:transparent;color:var(--text);font:500 14px var(--f-ui);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow)}
.drop{border:2px dashed color-mix(in srgb,var(--text2) 50%,transparent);border-radius:20px;padding:22px 16px;text-align:center;color:var(--text2);cursor:pointer;transition:background-color .2s,border-color .2s}
.drop.over{background:var(--pill);border-color:var(--accent)}
.drop b{color:var(--text);display:block;font-weight:600;margin:6px 0 2px}
.files{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.file{display:flex;align-items:center;gap:10px;background:var(--pill);border-radius:14px;padding:8px 10px 8px 12px;font-size:14px}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair)}
.set-row:last-child{border-bottom:0}
.set-row .l{min-width:0}
.set-row .l small{display:block;color:var(--text2);font-size:12.5px}
.stepper{display:inline-flex;align-items:center;background:var(--pill);border-radius:12px;flex:none}
.stepper button{width:36px;height:36px;border:0;background:transparent;border-radius:12px;font-size:18px}
.stepper span{min-width:34px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500}
.set-group{font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin:22px 0 2px}
.set-group:first-child{margin-top:4px}
.qr-box{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--pill);border-radius:22px;padding:16px}
.qr-box .qr{width:148px;height:148px;background:#FFFFFF;border-radius:14px;padding:8px;box-sizing:border-box;flex:none}
.qr-box .qr svg{width:100%;height:100%;display:block}
.qr-box .lnk{flex:1;min-width:200px;font-size:13px;overflow-wrap:anywhere}
.qr-box .lnk code{display:block;background:var(--card);border-radius:10px;padding:8px 10px;margin:6px 0 10px;font-size:12.5px;user-select:all}
.steps{margin:10px 0 0;padding-left:1.2em;color:var(--text);font-size:14px;line-height:1.55}
.steps li + li{margin-top:8px}
.setup-card{background:var(--card);border-radius:24px;padding:20px 20px 18px;margin:4px 0 18px;max-width:640px}
.setup-head{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.setup-head h3{margin:0;font:600 18px var(--f-ui)}
.setup-head svg{flex:none}
.icon-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.icon-pick button{height:46px;border-radius:12px;border:0;background:var(--pill);color:var(--text);display:grid;place-items:center}
.icon-pick button[aria-pressed="true"]{background:var(--accent);color:var(--on)}

.menu-scrim{position:absolute;inset:0;z-index:69}
.menu{position:absolute;z-index:70;min-width:228px;background:var(--card);color:var(--text);border-radius:18px;box-shadow:var(--shadow-lg);padding:6px;transform-origin:top left;transform:scale(.85);opacity:0;transition:transform .35s var(--ease),opacity .2s}
.menu.open{transform:none;opacity:1}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:44px;border:0;border-radius:12px;background:transparent;color:var(--text);padding:0 12px;font:400 15px var(--f-ui);text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--pill)}
.menu .sep{height:1px;background:var(--hair);margin:4px 8px}
.menu .ic{width:19px;height:19px;color:var(--text2)}

.folder-ov{position:absolute;inset:0;z-index:15;background:color-mix(in srgb,var(--bg) 45%,transparent);-webkit-backdrop-filter:blur(22px) saturate(1.3);backdrop-filter:blur(22px) saturate(1.3);opacity:0;transition:opacity .3s}
.folder-ov.open{opacity:1}
.folder-panel{position:absolute;left:50%;top:50%;width:min(720px,calc(100% - 28px));max-height:calc(100% - 140px);overflow-y:auto;box-sizing:border-box;padding:20px 16px 18px;border-radius:34px;background:color-mix(in srgb,var(--card) 82%,transparent);box-shadow:var(--shadow-lg);transform-origin:0 0}
.folder-panel h3{font:600 22px var(--f-ui);margin:0 4px 14px;display:flex;align-items:center;gap:8px}

.spot{position:absolute;inset:0;z-index:45;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);display:flex;flex-direction:column;opacity:0;transform:translateY(-24px);transition:opacity .25s,transform .45s var(--ease)}
.spot.open{opacity:1;transform:none}
.spot-head{display:flex;gap:10px;align-items:center;padding:calc(var(--safe-t) + 14px) var(--gut-r) 10px var(--gut-l);max-width:760px;width:100%;margin:0 auto;box-sizing:border-box}
.spot-head .search-field{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.spot-head input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;color:var(--text);height:44px;outline:none}
.spot-res{flex:1;overflow-y:auto;padding:4px var(--gut-r) calc(var(--safe-b) + 20px) var(--gut-l);max-width:760px;width:100%;margin:0 auto;box-sizing:border-box}
.spot-grp{font:600 11px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text2);margin:16px 6px 6px}
.res{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;color:var(--text);text-align:left;padding:8px;border-radius:16px}
.res:hover,.res.on{background:var(--card)}
.res .t{font-weight:500;display:block}
.res .s{font-size:13px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.res .tsq{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--on);display:grid;place-items:center;flex:none}
.res .tsq .tx{font:700 14px var(--f-retro)}

.toast{position:absolute;left:50%;bottom:calc(var(--safe-b) + 108px);z-index:80;transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:16px;font:500 14px var(--f-ui);box-shadow:var(--shadow-lg);transition:transform .45s var(--ease),opacity .25s;max-width:min(520px,calc(100% - 32px));box-sizing:border-box;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.banner{background:var(--pill);border-radius:16px;padding:10px 14px;font-size:13.5px;margin:14px 0 0;display:flex;gap:10px;align-items:center}

@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(640px,92vw);max-height:86%;border-radius:30px;transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform .5s var(--ease),opacity .25s}
  .sheet.open{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none}
  .page-title h2{font-size:30px}
  .dock{gap:14px}
}
@media (min-width:1100px){
  .doc-list{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:380px){
  .grades{gap:6px}
  .grade{font-size:13px}
  .stats{gap:6px}
  .stat{padding:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important}
  .study,.parrot,.sheet,.menu,.spot,.toast,.dv-bar{transition:opacity .2s !important}
  .study,.parrot{transform:none;opacity:0}
  .study.open,.parrot.open{opacity:1}
  .sheet{transform:none;opacity:0}
  .sheet.open{opacity:1}
  @media (min-width:760px){.sheet,.sheet.open{transform:translate(-50%,-50%)}}
  .editing .dcard{outline:2px dashed var(--accent)}
  .flip-in{transition:none}
}

/* ---------- Fiches détaillées : sous-titres, tableaux, encadrés ---------- */
.md h4{font:600 17px/1.3 var(--f-ui);margin:1.1em 0 .45em;color:var(--text)}
.md > h4:first-child{margin-top:0}
.tbl{overflow-x:auto;margin:0 0 1em;border-radius:16px;background:var(--pill);-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;width:100%;font-size:.94em;line-height:1.45}
.tbl th,.tbl td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid color-mix(in srgb,var(--text) 10%,transparent)}
.tbl th{font-weight:600;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.tbl tr:last-child td{border-bottom:0}
.callout.ex{border-left:4px solid var(--accent)}
.callout.tip{border-left:4px solid color-mix(in srgb,var(--accent) 55%,var(--text))}
.callout.trap{border-left:4px solid #C2523C}
.sheet-tools{display:flex;justify-content:flex-end;margin:0 0 12px}

/* ---------- Lecteur plein écran ---------- */
.reader{position:absolute;inset:0;z-index:50;background:var(--bg);color:var(--text);display:flex;flex-direction:column;opacity:0;transform:scale(.985);transition:opacity .3s,transform .4s var(--ease);--rd-size:19px}
.reader.open{opacity:1;transform:none}
.reader:fullscreen{background:var(--bg)}
.rd-prog{position:absolute;top:0;left:0;right:0;height:3px;z-index:3;background:transparent}
.rd-prog span{display:block;height:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}
.rd-bar{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 10px) var(--gut-r) 10px var(--gut-l);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);position:relative;z-index:2;border-bottom:1px solid color-mix(in srgb,var(--text) 8%,transparent)}
.rd-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.rd-title b{font:600 15px var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-title small{font:400 12.5px var(--f-ui);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-btn{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--pill);color:var(--text);display:grid;place-items:center}
.rd-btn:disabled{opacity:.35}
.rd-btn.big{width:48px;height:48px;background:var(--card);box-shadow:var(--shadow)}
.rd-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
.rd-page{max-width:74ch;margin:0 auto;padding:28px var(--gut-r) calc(var(--safe-b) + 120px) var(--gut-l);font-size:var(--rd-size)}
.rd-head{margin:6px 0 30px}
.rd-kicker{font:600 11.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--text2)}
.rd-head h1{font:700 clamp(28px,4.6vw,44px)/1.1 var(--f-retro);font-variation-settings:"SOFT" 100;margin:10px 0 12px;text-wrap:balance}
.rd-about{font-size:1em;line-height:1.6;color:var(--text2);margin:0}
.rd-guide{display:flex;gap:8px;align-items:flex-start;font-size:.8em;color:var(--text2);margin:14px 0 0;background:var(--pill);border-radius:14px;padding:10px 12px}
.rd-guide svg{flex:none;width:18px;height:18px;margin-top:2px}
.rd-sec{padding:26px 0 8px;border-top:1px solid color-mix(in srgb,var(--text) 10%,transparent)}
.rd-num{font:600 11.5px var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.rd-sec h2{font:600 1.45em/1.2 var(--f-retro);font-variation-settings:"SOFT" 100;margin:6px 0 16px;text-wrap:balance}
.rd-md p,.rd-md li{line-height:1.7}
.rd-md p{max-width:none}
.rd-sec .keypts{margin:18px 0 10px}
.rd-end{display:flex;justify-content:center;padding:30px 0 0}
.rd-end .btn-retro{max-width:420px}
.rd-nav{position:absolute;left:50%;bottom:calc(var(--safe-b) + 16px);transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:6px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow-lg);z-index:2}
.rd-count{font:600 14px var(--f-ui);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
@media (prefers-reduced-motion:reduce){.reader{transition:opacity .2s;transform:none}}

  const flushList = () => { if (list) { out += `<${list.t}>` + list.items.map(i => '<li>' + inlineMd(i) + '</li>').join('') + `</${list.t}>`; list = null; } };

- paragraphes courts séparés par une ligne vide ; "### " pour un sous-titre ; listes "- " ou "1. " ;

/* Base locale de secours (même interface réduite) */
class LocalDB {

/* File d'écriture : une écriture à la fois par document */
const chains = new Map();
function dbWrite(path, op, data) {

    const ref = S.db.doc(path);
    try { await (op === 'delete' ? ref.delete() : ref[op](data)); }
    catch (e) {
      if (e && e.code === 'unavailable') { await sleep(500 + Math.random() * 700); return op === 'delete' ? ref.delete() : ref[op](data); }
      throw e;
    }

  return p;
}
function writeError(e, path) {
  console.warn('write', path, e);
  if (!e) return;
  if (e.code === 'quota_exceeded') toast("L'espace de stockage de l'appli est plein. Supprime d'anciens documents.");
  else if (e.code === 'invalid_argument' && /docs|cards/.test(path)) toast("Enregistrement refusé (document trop volumineux ?).");
  else if (e.code === 'revoked' || e.code === 'not_granted') toast("L'enregistrement n'est plus autorisé sur cette vue.");
}
let stateTimer = 0;
function saveState(now) {
  clearTimeout(stateTimer); stateTimer = 0;
  const go = () => dbWrite('app/state', 'set', clone(st()));
  if (now) return go();
  stateTimer = setTimeout(() => { stateTimer = 0; go(); }, 400);
}
function saveDoc(d) { d.updatedAt = Date.now(); S.docs.set(d.id, d); notify('docs'); return dbWrite('docs/' + d.id, 'set', clone(d)); }
function patchDoc(id, patch) {
  const d = S.docs.get(id); if (!d) return Promise.resolve();
  deepMerge(d, patch); d.updatedAt = Date.now(); notify('docs');
  return dbWrite('docs/' + id, 'update', clone(Object.assign({}, patch, { updatedAt: d.updatedAt })));
}
function cardSet(docId) { return S.cards.get(docId) || null; }

  let set = S.cards.get(docId); const isNew = !set;

  const add = {}; let i = 0;
  for (const c of list) { const cid = uid('c') + (i++); const card = { f: String(c.front).slice(0, 2000), b: String(c.back).slice(0, 4000), s: newSrs(), at: Date.now() + i }; if (c.tag) card.tag = c.tag; set.cards[cid] = card; add[cid] = card; }

  return dbWrite('cards/' + docId, 'update', { cards: clone(add) });
}

  deepMerge(set.cards[cid], patch); notify('cards');
  return dbWrite('cards/' + docId, 'update', { cards: { [cid]: clone(patch) } });
}

}

/* ---------- Attribution des palettes (section 6 du brief) ---------- */
function assignDocumentPalette() {
  const s = st();
  if (!Array.isArray(s.bag) || !s.bag.length) {
    let bag = shuffle(range(1, 90)), guard = 0;
    while ((s.recent || []).includes(bag[0]) && guard++ < 60) bag = shuffle(range(1, 90));
    s.bag = bag;
  }
  const id = s.bag.shift();
  s.recent = [id, ...(s.recent || [])].slice(0, 10);
  saveState();
  return id;
}
function assignHomePalettes(ids) {
  const map = new Map(); let bag = [], prev = -1;
  for (const s of ids) {
    if (!bag.length) bag = shuffle(range(91, 100));
    let id = bag.shift();
    if (id === prev && bag.length) { bag.push(id); id = bag.shift(); }
    map.set(s, id); prev = id;
  }
  return map;
}

/* ---------- Thématiques ---------- */

  const list = [...S.docs.values()].filter(d => d.themeId === themeId || (!themeById(d.themeId) && themeId === st().themes[0]?.id));
  const ord = st().order[themeId] || [];
  return list.sort((a, b) => {
    const ia = ord.indexOf(a.id), ib = ord.indexOf(b.id);
    if (ia >= 0 && ib >= 0) return ia - ib; if (ia >= 0) return 1; if (ib >= 0) return -1;

}

/* ---------- Démarrage de la base ---------- */

  const slowTimer = setTimeout(() => { if (!S.loaded.docs) { S.slow = true; notify('slow'); } }, 10000);
  const onErr = what => e => { console.warn('snapshot', what, e); if (e && e.code === 'revoked') toast("L'accès aux données a été retiré."); };

    } else if (!snap.metadata.fromCache) {

  }, onErr('cards'));
  db.collection('lang').onSnapshot(snap => {

const Voice = {

  why() {

    const r = clamp(rate ?? settings().rate ?? 0.9, 0.7, 1.5);

/* Carte mentale : arbre de gauche à droite, couleurs du document */
function mindmapEl(root) {
  const cv = document.createElement('canvas').getContext('2d');
  const fonts = ['600 17px Fraunces, Georgia, serif', '500 14.5px Jost, system-ui, sans-serif', '400 13.5px Jost, system-ui, sans-serif'];
  let leaf = 12;
  const build = (n, depth) => {
    const label = asStr(n && n.label, 70) || '…';
    cv.font = fonts[Math.min(depth, 2)];
    const node = { label, depth, w: cv.measureText(label).width + (depth < 2 ? 32 : 18), h: depth === 0 ? 46 : depth === 1 ? 34 : 26, kids: [] };
    if (depth < 3 && n && Array.isArray(n.children)) node.kids = n.children.slice(0, 10).map(k => build(k, depth + 1));
    return node;
  };
  const tree = build(root, 0);
  const place = n => { if (!n.kids.length) { n.y = leaf + n.h / 2; leaf += n.h + 10; } else { n.kids.forEach(place); n.y = (n.kids[0].y + n.kids[n.kids.length - 1].y) / 2; } };
  place(tree);
  const colW = []; (function walk(n) { colW[n.depth] = Math.max(colW[n.depth] || 0, n.w); n.kids.forEach(walk); })(tree);
  const gap = 44, colX = []; let acc = 14; colW.forEach((w, i) => { colX[i] = acc; acc += w + gap; });

    const t = esc(n.label);
    if (n.depth === 0) nodes += `<rect x="${x}" y="${n.y - n.h / 2}" width="${n.w}" height="${n.h}" rx="${n.h / 2}" style="fill:var(--accent)"/><text x="${x + n.w / 2}" y="${n.y + 6}" text-anchor="middle" style="fill:var(--on);font:600 17px var(--f-retro)">${t}</text>`;
    else if (n.depth === 1) nodes += `<rect x="${x}" y="${n.y - n.h / 2}" width="${n.w}" height="${n.h}" rx="${n.h / 2}" style="fill:var(--pill)"/><text x="${x + n.w / 2}" y="${n.y + 5}" text-anchor="middle" style="fill:var(--text);font:500 14.5px var(--f-ui)">${t}</text>`;
    else nodes += `<circle cx="${x + 5}" cy="${n.y}" r="4" style="fill:var(--header)"/><text x="${x + 15}" y="${n.y + 4.5}" style="fill:var(--text);font:400 13.5px var(--f-ui)">${t}</text>`;
  })(tree);
  return h('div', { html: `<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(tree.label)}"><g fill="none" style="stroke:var(--text2)" stroke-width="1.6" opacity=".55">${links}</g>${nodes}</svg>` }).firstChild;
}

async function pdfRead(file) {

/* Formulaire de liaison (accueil d'un appareil pas encore relié, et fenêtre « Relier ») */
function pairForm() {
  const inp = h('textarea', { class: 'inp', rows: 2, placeholder: 'Colle ici ton code d’accès (github_pat_…) ou un lien d’appairage', 'aria-label': 'Code d’accès GitHub', autocomplete: 'off', spellcheck: 'false' });
  const err = h('p', { class: 'small', style: 'color:#C2523C;margin:8px 0 0', hidden: true });
  const fail = t => { err.hidden = false; err.textContent = t; };
  const btn = h('button', { class: 'btn', onclick: () => go() }, 'Relier cet appareil');
  const go = async () => {
    let v = inp.value.trim(); const m = v.match(/[#&]t=([\w-]{20,})/); if (m) v = m[1];
    if (!v) return fail('Colle d’abord ton code d’accès dans la case.');
    if (/^sk-ant-/.test(v)) return fail('Ça, c’est le jeton Claude du robot : il va dans « Connecter Claude au serveur.cmd ». Ici, il faut le code d’accès GitHub (github_pat_…).');
    if (!/^[\w-]{20,}$/.test(v)) return fail('Ce n’est pas un code d’accès GitHub : il commence par github_pat_ et ne contient pas d’espace.');
    btn.disabled = true; btn.textContent = 'Vérification…'; err.hidden = true;
    try { await ONLINEAPI.pair(v); toast('Appareil relié : chargement de tes cours…'); setTimeout(() => location.reload(), 600); }
    catch (e) {
      btn.disabled = false; btn.textContent = 'Relier cet appareil';
      fail(e.code === 'not_paired' ? 'GitHub refuse ce code : il est incomplet, mal copié ou supprimé. Recopie-le en entier.'
        : e.code === 'not_found' || e.code === 'forbidden' ? `Ce code ne voit pas ton dépôt « ${GH.repo} ». Recrée-le en choisissant bien « Only select repositories » › ${GH.repo}, avec « Contents : Read and write ».`
        : e.code === 'offline' ? 'Pas de connexion internet.' : 'Vérification impossible pour le moment. Réessaie dans une minute.');
    }
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } });
  return h('div', null,
    h('ol', { class: 'steps', style: 'margin:0 0 14px' },
      h('li', null, h('b', null, 'Crée ton code d’accès sur GitHub'), ' (une seule fois) : la page s’ouvre déjà remplie. Sous « Repository access », choisis « Only select repositories » puis ', h('b', null, GH.repo), '. Descends tout en bas et clique sur « Generate token », puis copie le code affiché.',
        h('div', { class: 'row', style: 'margin:8px 0 6px' }, h('a', { class: 'btn soft sm', href: TOKEN_URL, target: '_blank', rel: 'noopener', style: 'text-decoration:none' }, icon('link'), 'Créer le code sur GitHub'))),
      h('li', null, h('b', null, 'Colle-le ici'), ' puis touche « Relier cet appareil ». Cet appareil s’en souviendra.')),
    h('div', { class: 'fld', style: 'margin-bottom:10px' }, inp, err),
    h('div', { class: 'row end' }, btn),
    h('p', { class: 'small', style: 'margin:14px 0 0;color:var(--text2)' }, 'Tes autres appareils n’ont pas besoin de code : sur un appareil déjà relié, Réglages › Appareils affiche un QR code qui les relie d’un coup.'));
}

/* Paquets déposés dans d/inbox (par Claude Code ou par toi) */
let INBOX_BUSY = false;
async function processInbox() {
  if (INBOX_BUSY || !S.loaded.state || !S.loaded.docs || !ONLINEAPI.status.synced) return;
  const ids = ONLINEAPI.inboxIds(); if (!ids.length) return;
  INBOX_BUSY = true;
  try {
    for (const id of ids) {
      const snap = await S.db.doc('inbox/' + id).get(); const item = snap.exists ? snap.data() : null;
      await S.db.doc('inbox/' + id).delete();
      if (!item) continue;
      const deck = typeof item.deck === 'object' && item.deck ? parseDeck(JSON.stringify(item.deck)) : parseDeck(item.text || '');
      const has = deck.cards.length || (deck.sections || []).length || (deck.qcm || []).length || (deck.exercises || []).length;
      if (!has) { toast(`« ${item.name || 'paquet'} » n'a pas pu être lu comme un paquet.`, 4200); continue; }
      let theme = st().themes[0].id;
      if (deck.theme && !sections().some(s => norm(s.name) === norm(deck.theme))) { const tid = uid('t'); st().themes.push({ id: tid, name: String(deck.theme).slice(0, 40), icon: guessIcon(deck.theme) }); saveState(); theme = tid; }
      const docId = await importDeck(deck, { themeId: theme, title: deck.title || item.name });
      toast(`Nouveau document de Claude : « ${(S.docs.get(docId) || {}).title || item.name} »`, 4200);
    }
  } finally { INBOX_BUSY = false; }
}
ONLINEAPI.onInbox(() => setTimeout(processInbox, 400));
onData(k => { if (k.has('state') || k.has('docs') || k.has('*')) processInbox(); });

        h('li', null, 'Android : menu ⋮ › « Ajouter à l’écran d’accueil ». PC : Edge ou Chrome › menu › Applications › « Installer Révision ».'),
        h('li', null, 'Pas besoin que ton PC soit allumé : tout passe par GitHub.')),
      h('div', { class: 'row', style: 'margin-top:8px' }, h('button', { class: 'btn ghost sm', onclick: async () => { if (await confirmDlg('Délier cet appareil ?', { ok: 'Délier', danger: true, detail: 'Les données restent sur GitHub et sur tes autres appareils. Il faudra relier cet appareil de nouveau pour s’en servir.' })) ONLINEAPI.unpair(); } }, 'Délier cet appareil')));
  };

      h('button', { class: 'btn soft sm', onclick: async ev => { ev.currentTarget.disabled = true; await ONLINEAPI.sync(); drawData(); } }, icon('refresh'), 'Synchroniser')));

  drawClaude(); drawDev(); drawData();

  ONLINEAPI.robotRuns().then(r => { run = r; drawClaude(); });
  return { claude: claudeBox, devices: devBox, data: dataBox, dispose: off };
}

function boot() {
  OV = $('#app');
  CTX_PAL_FN = () => PARROT ? pal(+PARROT.root.dataset.pal) : STUDY && STUDY.palId ? pal(STUDY.palId) : D.cur ? pal(+D.cur.root.dataset.pal) : null;
  buildHome();

  const saved = store('page');
  let restored = false;
  onMode(() => { refreshPalettes(); updateColors(); });
  onData(() => {
    if (!restored && S.loaded.state) {
      restored = true;
      const i = sections().findIndex(s => s.id === saved);
      if (i > 0) { H.idx = i; H.pos = i; H.spring.set(i); }
    }
    renderHome();
    if (D.cur) renderDocBody();
    if (FOLDER_RENDER) FOLDER_RENDER();
  });
  addEventListener('keydown', e => {
    if (e.key === 'Escape') { const f = escStack[escStack.length - 1]; if (f) { e.preventDefault(); f(); } return; }
    const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
    if (mod && k === 'f') { e.preventDefault(); if (!STUDY && !PARROT) openSearch(); return; }
    if (isTyping() || STUDY || PARROT || $('.sheet.open') || $('.spot') || $('.menu')) return;
    if (!D.cur && !e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); goPage(H.idx + (e.key === 'ArrowLeft' ? -1 : 1)); return; }
    if (k === 'n' && !e.altKey && !e.shiftKey) { e.preventDefault(); openImport({ themeId: D.cur ? S.docs.get(D.cur.id)?.themeId : undefined }); return; }
    if (e.key === '/' && !mod) { e.preventDefault(); openSearch(); }
  });
  initStore();
  initClaude();
  setInterval(renderBrandDay, 5 * 60e3);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
